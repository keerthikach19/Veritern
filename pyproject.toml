[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritern"
version = "0.1.0"
description = "Evidence-first internship and job program investigations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "streamlit>=1.45,<2", "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3",
  "groq>=0.30,<1", "httpx==0.28.1", "httpcore==1.0.9", "anyio>=4.9,<5",
  "trafilatura>=2,<3", "pypdf>=5,<7", "pypdfium2>=4.30,<6",
  "Pillow>=11,<13", "pytesseract>=0.3.13,<0.4", "tldextract>=5.3,<6",
  "idna>=3.10,<4", "dnspython>=2.7,<3", "PyYAML>=6,<7"
]

[project.scripts]
veritern = "veritern.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"fixtures/synthetic" = "veritern/data/synthetic"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "respx>=0.22,<0.23", "ruff>=0.11,<1", "pip-licenses>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in network/provider checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
